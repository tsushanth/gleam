name: Gleam
options:
  bundleIdPrefix: com.appfactory
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "11.0.0"
  FacebookSDK:
    url: https://github.com/facebook/facebook-ios-sdk
    from: "17.0.0"

targets:
  Gleam:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Gleam
        excludes:
          - "**/.DS_Store"
    resources:
      - path: Gleam/Resources/Assets.xcassets
      - path: Gleam/Resources/GoogleService-Info.plist
    dependencies:
      - package: Firebase
        product: FirebaseAnalytics
      - package: FacebookSDK
        product: FacebookCore
      - sdk: AdServices.framework
      - sdk: AppTrackingTransparency.framework
      - sdk: AuthenticationServices.framework
      - sdk: AVFoundation.framework
      - sdk: StoreKit.framework
      - sdk: UserNotifications.framework
    entitlements:
      path: Gleam/Resources/Gleam.entitlements
    info:
      path: Gleam/Resources/Info.plist
      properties:
        CFBundleDisplayName: Gleam
        CFBundleIdentifier: com.appfactory.gleam
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0"
        NSUserNotificationsUsageDescription: "Gleam sends reminders when your rooms need attention, so nothing slips through the cracks."
        NSCameraUsageDescription: "Gleam can scan a room to identify cleaning tasks automatically."
        NSMicrophoneUsageDescription: "Gleam uses your microphone for hands-free task completion by voice."
        NSMotionUsageDescription: "Gleam uses motion data to detect when you're home and suggest cleaning sessions."
        NSUserTrackingUsageDescription: "This identifier will be used to deliver personalized ads to you."
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: "v9wttpbfk9.skadnetwork"
          - SKAdNetworkIdentifier: "n38lu8286q.skadnetwork"
          - SKAdNetworkIdentifier: "238da6jt44.skadnetwork"
          - SKAdNetworkIdentifier: "22mmun2rn5.skadnetwork"
        FacebookAppID: "$(FACEBOOK_APP_ID)"
        FacebookClientToken: "$(FACEBOOK_CLIENT_TOKEN)"
        FacebookDisplayName: "Gleam"
        UILaunchStoryboardName: LaunchScreen
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
        LSApplicationQueriesSchemes:
          - fbapi
          - fb-messenger-share-api
        MinimumOSVersion: "17.0"
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        SWIFT_VERSION: "5.9"
        PRODUCT_BUNDLE_IDENTIFIER: com.appfactory.gleam
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
      debug:
        DEBUG_INFORMATION_FORMAT: dwarf
        SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      release:
        DEBUG_INFORMATION_FORMAT: "dwarf-with-dsym"
        SWIFT_OPTIMIZATION_LEVEL: "-Owholemodule"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""
        VALIDATE_PRODUCT: YES
